version: '3.8'

services:
  # MySQL 설정
  db:
    image: mariadb:10.5
    container_name: fashion_db
    restart: always
    environment:
      MYSQL_DATABASE: fashion_game
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  # Redis 설정
  redis:
    image: redis:latest
    container_name: fashion_redis
    restart: always
    ports:
      - "6379:6379"
